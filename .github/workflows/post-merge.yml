name: worklog-post-merge
# After a PR lands on main, honor triggers.pr-merge (default: regenerate
# derived docs + advisory sync --report). compact.yml already does the
# regenerate nightly; this job does it at merge time. sync --report is
# advisory (spec §12). The action list is `.work/config.yml` →
# `worklog triggers pr-merge`, not this file.
#
# Main is pull-only for everyone, bots included (ADR-0011). This job never
# git-pushes main: it opens a PR with a maintainer PAT so pull_request
# checks run natively, and arms auto-merge. Never squash (ADR-0008).

on:
  pull_request:
    types: [closed]

concurrency:
  group: worklog-post-merge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post-merge:
    # Bot PRs are excluded by branch prefix. With a real identity a merged
    # bot PR fires this event too, so the guard is required, not
    # accidental. The deeper terminator is that rendering from the log's
    # `git` field is idempotent: a second run over the same main is a no-op
    # and opens no PR.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      !startsWith(github.event.pull_request.head.ref, 'chore/compact-') &&
      !startsWith(github.event.pull_request.head.ref, 'chore/post-merge-')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.WORKLOG_BOT_PAT }}
    steps:
      - name: require WORKLOG_BOT_PAT
        run: test -n "$GH_TOKEN" || { echo "WORKLOG_BOT_PAT secret missing (ADR-0011)"; exit 1; }

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKLOG_BOT_PAT }}
          fetch-depth: 0
          ref: main

      # Supersede, do not rebase (see compact.yml).
      - name: close superseded bot PRs
        run: |
          for n in $(gh pr list --state open --json number,headRefName \
                     --jq '.[] | select(.headRefName | startswith("chore/compact-") or startswith("chore/post-merge-")) | .number'); do
            gh pr close "$n" --delete-branch --comment "superseded by worklog-post-merge run ${GITHUB_RUN_ID}" || true
          done

      - name: resolve triggers.pr-merge
        run: python3 bin/worklog triggers pr-merge | tee /tmp/pr-merge-triggers.json

      # ticketing.sync_owner: ci (#413): CI is the authoritative syncer.
      # resolve_adapter() reads only WORKLOG_TICKET_ADAPTER or the gitignored
      # sync-state.json, neither of which a runner has, so the adapter is
      # named here. --push-only because bare sync also pulls the whole board
      # from EPOCH. sync-state.json is cached so is_dirty does not re-push
      # every open item on every merge. Runs before the render so new ticket
      # keys land on the roadmap; the link events ride the derived-docs PR.
      - name: restore sync state
        uses: actions/cache@v4
        with:
          path: .work/sync-state.json
          key: sync-state-${{ github.run_id }}
          restore-keys: sync-state-

      - name: ci-owned ticket sync
        env:
          WORKLOG_TICKET_ADAPTER: adapters/github/adapter
        run: |
          owner=$(python3 -c 'import sys; sys.path.insert(0, "bin"); import sync_dispatch as s; print(s.ticketing_config().get("sync_owner", "human"))')
          [ "$owner" = "ci" ] || { echo "ticketing.sync_owner is $owner; sync stays advisory"; exit 0; }
          bin/worklog sync --push-only --force --retry-base-delay 1

      - name: regenerate derived docs
        run: |
          python3 -c 'import json,sys; a=json.load(open("/tmp/pr-merge-triggers.json"))["actions"]; sys.exit(0 if "roadmap-render" in a else 1)' || exit 0
          bin/worklog roadmap-render
          bin/worklog ia-inventory
          bin/worklog ia-manifest

      # A real drift finding exits 1; capture it anyway and post it. A repo
      # with no adapter prints the local-only line, which is a mode, not
      # news: no comment then.
      - name: sync drift report
        run: |
          python3 -c 'import json,sys; a=json.load(open("/tmp/pr-merge-triggers.json"))["actions"]; sys.exit(0 if any(x=="ticket-sync" or x.startswith("ticket-sync:") for x in a) else 1)' || exit 0
          bin/worklog sync --report > /tmp/sync-report.txt 2>&1 || true
          cat /tmp/sync-report.txt
          if grep -qi "no adapter configured\|LOCAL_ONLY\|local-only" /tmp/sync-report.txt; then
            echo "no adapter configured; skipping the PR comment"
            exit 0
          fi
          {
            echo "## post-merge sync --report"
            echo
            echo '```'
            cat /tmp/sync-report.txt
            echo '```'
          } > /tmp/sync-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/sync-comment.md || true

      - name: commit via PR
        run: |
          if [ -z "$(git status --porcelain docs .work/todo.jsonl)" ]; then
            echo "no derived-doc changes"
            exit 0
          fi
          git config user.name "worklog-bot"
          git config user.email "worklog-bot@users.noreply.github.com"
          branch="chore/post-merge-${{ github.event.pull_request.number }}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add docs .work/todo.jsonl
          WORKLOG_SKIP_BRANCH_GUARD=1 hooks/pre-commit
          python3 bin/compact.py --merge-check .work/todo.jsonl .work/done.jsonl
          git commit -m "chore(worklog): post-merge regenerate derived docs (#${{ github.event.pull_request.number }})"
          git push -u origin HEAD
          gh pr create --head "$branch" --base main \
            --title "chore(worklog): post-merge regenerate derived docs (#${{ github.event.pull_request.number }})" \
            --body "Post-merge derived-doc regenerate for #${{ github.event.pull_request.number }}. Auto-merge when green (ADR-0011). Never squash (ADR-0008)."
          gh pr merge --auto --merge --delete-branch
