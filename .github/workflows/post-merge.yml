name: worklog-post-merge
# After a PR lands on main, honor triggers.pr-merge (default: regenerate
# derived docs + advisory sync --report). compact.yml already does the
# regenerate nightly; this job does it at merge time. sync --report is
# advisory (spec §12). The action list is `.work/config.yml` →
# `worklog triggers pr-merge`, not this file.
#
# GITHUB_TOKEN cannot bypass the merge-when-green ruleset (User 41898282
# does not exempt the Actions installation token; Integration 15368 is
# 422). So this job never git-pushes main. It opens a PR and arms
# auto-merge (ADR-0010). Never squash (ADR-0008).
#
# A push made with the default GITHUB_TOKEN does not trigger sibling
# `push` workflows. worklog-invariants listens on workflow_run of this
# job for the same reason it listens on worklog-compact (#361).

on:
  pull_request:
    types: [closed]

concurrency:
  group: worklog-post-merge
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  post-merge:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: resolve triggers.pr-merge
        run: python3 bin/worklog triggers pr-merge | tee /tmp/pr-merge-triggers.json

      - name: regenerate derived docs
        run: |
          python3 -c 'import json,sys; a=json.load(open("/tmp/pr-merge-triggers.json"))["actions"]; sys.exit(0 if "roadmap-render" in a else 1)' || exit 0
          bin/worklog roadmap-render
          bin/worklog ia-inventory
          bin/worklog ia-manifest

      - name: sync drift report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import json,sys; a=json.load(open("/tmp/pr-merge-triggers.json"))["actions"]; sys.exit(0 if any(x=="ticket-sync" or x.startswith("ticket-sync:") for x in a) else 1)' || exit 0
          bin/worklog sync --report | tee /tmp/sync-report.txt
          {
            echo "## post-merge sync --report"
            echo
            echo '```'
            cat /tmp/sync-report.txt
            echo '```'
          } > /tmp/sync-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/sync-comment.md || true

      - name: commit via PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain docs)" ]; then
            echo "no derived-doc changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/post-merge-${{ github.event.pull_request.number }}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add docs
          WORKLOG_SKIP_BRANCH_GUARD=1 hooks/pre-commit
          python3 bin/compact.py --merge-check .work/todo.jsonl .work/done.jsonl
          git commit -m "chore(worklog): post-merge regenerate derived docs (#${{ github.event.pull_request.number }})"
          git push -u origin HEAD
          gh pr create --head "$branch" --base main \
            --title "chore(worklog): post-merge regenerate derived docs (#${{ github.event.pull_request.number }})" \
            --body "Post-merge derived-doc regenerate for #${{ github.event.pull_request.number }}. Auto-merge when green (ADR-0010). Never squash (ADR-0008)."
          gh workflow run worklog-invariants --ref "$branch"
          gh pr merge --auto --merge
