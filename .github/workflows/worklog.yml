name: worklog-invariants
# Read-only on purpose: the merge gate's required checks are commit
# statuses named `invariants` and `coverage`, and a status with that
# context from any actor with `statuses: write` satisfies the ruleset
# (`integration_id` pinning is refused, CHANGELOG 0.24.10). Nothing here
# posts anything, so nothing here may inherit the repo-default write.
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:
  # Bot PRs and their merge commits are made with a maintainer PAT
  # (ADR-0011), so `push` and `pull_request` fire for them natively. The
  # workflow_run listener that covered GITHUB_TOKEN pushes (#361) is gone.

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Same script as the local hook: trailing newline, event schema,
      # roadmap freshness. A dev can --no-verify past the local hook; not
      # this. WORKLOG_SKIP_BRANCH_GUARD: this step runs on whatever ref was
      # checked out (including main on push) with no commit in flight --
      # the branch guard only makes sense for an actual `git commit`.
      - name: log invariants
        run: WORKLOG_SKIP_BRANCH_GUARD=1 hooks/pre-commit
      # The merge guards run again here, standalone (ADR-0005, #262). Inside
      # the hook they are gated on a merge being IN FLIGHT -- WORKLOG_MERGE_
      # COMMIT or an on-disk MERGE_HEAD -- and neither exists in a CI
      # checkout, so that path protects developer machines only. The check
      # itself needs no merge in flight: it is a pure function of the two
      # files, and for a pull_request GitHub checks out the merge result, so
      # this sees exactly what the hook would have seen locally.
      - name: merge integrity (resurrection + duplicate ownership)
        run: python3 bin/compact.py --merge-check .work/todo.jsonl .work/done.jsonl
      # Opt-in remote dedupe gate (#413, ticketing.ci_dedupe_check). Needs the
      # bot token; skipped, never failed, when it is absent (a fork PR never
      # sees secrets).
      - name: remote dedupe check
        env:
          GH_TOKEN: ${{ secrets.WORKLOG_BOT_PAT }}
          WORKLOG_TICKET_ADAPTER: adapters/github/adapter
        run: |
          on=$(python3 -c 'import sys; sys.path.insert(0, "bin"); import sync_dispatch as s; print(s.ticketing_config().get("ci_dedupe_check", "false"))')
          [ "$on" = "true" ] || { echo "skipped: ticketing.ci_dedupe_check is off"; exit 0; }
          [ -n "$GH_TOKEN" ] || { echo "skipped: no token"; exit 0; }
          bin/worklog dedupe --dry-run --check
      # commit-msg's own MERGE_HEAD check doesn't exist post-hoc in a CI
      # checkout, so re-derive "was this a merge" via --no-merges instead.
      - name: commit messages reference a worklog item or ticket
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          for sha in $(git rev-list --no-merges "$base..HEAD"); do
            git log -1 --format=%B "$sha" > /tmp/msg
            hooks/commit-msg /tmp/msg || { echo "commit $sha:"; cat /tmp/msg; exit 1; }
          done
      - name: tests
        run: |
          python3 tests/test_fold.py
          python3 tests/test_ulid.py
          python3 tests/test_compact.py
          python3 tests/test_retention.py
          python3 tests/test_watermark.py
          python3 tests/test_github_adapter.py
          python3 tests/test_merge_green.py
          python3 tests/test_published.py
          python3 tests/test_render_roadmap.py
          python3 tests/test_plan_capture.py
          python3 tests/test_ia.py
          python3 tests/test_pr_sync.py
          python3 tests/test_gone_policy.py
          python3 tests/test_ticket_ref_warning.py
          python3 tests/test_item_fields.py
          python3 tests/test_triggers.py
          python3 tests/test_hygiene.py
      # PR simulations: real git repos, branches, union merges, hook gates
      - name: integration tests
        run: |
          python3 tests/test_integration.py
          python3 tests/test_plugin.py
          python3 tests/test_adapter_contract.py
          python3 tests/test_dispatch.py
          # Builds throwaway repos and runs real union merges across a
          # compaction, so it belongs here rather than in the fast step (#261).
          python3 tests/test_bug_merge.py
          python3 tests/test_bug_381.py
          python3 tests/test_bug_382.py
          python3 tests/test_bug_383.py
          python3 plugin/tests/test_three_host_hooks.py

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Subprocess-aware: a site .pth starts coverage in every python child
      # (the suites exercise bin/ via sandboxed `python3 bin/worklog ...`);
      # COVERAGE_FILE keeps data files out of sandbox dirs the tests delete;
      # .coveragerc's [paths] maps sandbox copies back onto bin/ at combine.
      - name: install coverage + subprocess hook
        run: |
          pip install coverage
          python3 -c "import coverage, os; open(os.path.join(os.path.dirname(os.path.dirname(coverage.__file__)), 'worklog_cov.pth'), 'w').write('import coverage; coverage.process_startup()\n')"
      - name: coverage gate (>=80%, target 95%)
        run: |
          export COVERAGE_PROCESS_START="$PWD/.coveragerc" COVERAGE_FILE="$PWD/.coverage"
          for t in tests/test_*.py; do python3 -m coverage run "$t"; done
          unset COVERAGE_PROCESS_START
          python3 -m coverage combine -q
          python3 -m coverage report --include='*/bin/*.py' --fail-under=80 -m
