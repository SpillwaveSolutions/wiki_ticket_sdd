name: worklog-compact
# WORKLOG-SPEC section 7: compaction runs in CI, on main, in its own commit.
# That commit cannot be a GITHUB_TOKEN push to main: the merge-when-green
# ruleset requires a pull request, User 41898282 does not exempt the
# Actions installation token, and Integration 15368 is 422. So this job
# opens a PR and arms auto-merge (ADR-0010). Never squash (ADR-0008).

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  compact:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: compact
        run: python3 bin/compact.py

      # Compaction restamps the top of the log with the current HEAD sha, and
      # the roadmap and IA manifest both record that sha as build provenance.
      # Committing the log without them leaves main failing
      # tests/test_provenance.py on a clean checkout -- a break no developer
      # caused and none can fix locally, because the next scheduled run
      # reintroduces it. Order matters: ia-manifest hashes what ia-inventory
      # wrote, which reads the roadmap, so running them out of order leaves a
      # stale body hash instead of fixing one.
      - name: regenerate derived docs
        run: |
          bin/worklog roadmap-render
          bin/worklog ia-inventory
          bin/worklog ia-manifest

      # Fail here before opening a PR that is already red. The PR still
      # pays invariants + coverage (required checks). worklog-invariants
      # also listens on workflow_run of this job (#361).
      - name: verify working tree
        run: |
          python3 bin/compact.py --merge-check .work/todo.jsonl .work/done.jsonl
          for t in tests/test_*.py; do python3 "$t" >/dev/null || { echo "FAILED: $t"; python3 "$t"; exit 1; }; done

      - name: commit via PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain .work docs)" ]; then
            echo "nothing to compact"
            exit 0
          fi
          wm=$(python3 -c "import json; print([e.get('through') for e in map(json.loads, open('.work/todo.jsonl')) if e.get('op') == 'compact'][-1])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/compact-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add .work/todo.jsonl .work/done.jsonl .work/archive.jsonl docs
          WORKLOG_SKIP_BRANCH_GUARD=1 hooks/pre-commit
          git commit -m "chore(worklog): compact through $wm"
          git push -u origin HEAD
          gh pr create --head "$branch" --base main \
            --title "chore(worklog): compact through $wm" \
            --body "Nightly compaction. Auto-merge when green (ADR-0010). Never squash (ADR-0008)."
          # GITHUB_TOKEN pull_request runs may sit action_required
          # (github-actions[bot] treated as a first-time contributor; #403).
          # workflow_dispatch is the event GitHub does fire for GITHUB_TOKEN
          # (#361). Dispatch invariants on this branch so required checks
          # land without a maintainer click.
          gh workflow run worklog-invariants --ref "$branch"
          gh pr merge --auto --merge
