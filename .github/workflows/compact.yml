name: worklog-compact
# WORKLOG-SPEC section 7: compaction runs in CI, on main, in its own commit.
# Main is pull-only for everyone, bots included (ADR-0011). This job opens
# a PR with a maintainer PAT so pull_request checks run natively, and arms
# auto-merge. Never squash (ADR-0008).

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

# Every bot PR regenerates from main and supersedes the last one, so two
# runs never need to coordinate beyond "close the older PR first".
permissions:
  contents: read

jobs:
  compact:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.WORKLOG_BOT_PAT }}
    steps:
      # Fail loudly, never fall back: a missing PAT must not turn into a
      # GITHUB_TOKEN PR that sits action_required forever (#403).
      - name: require WORKLOG_BOT_PAT
        run: test -n "$GH_TOKEN" || { echo "WORKLOG_BOT_PAT secret missing (ADR-0011)"; exit 1; }

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKLOG_BOT_PAT }}
          fetch-depth: 0

      # Supersede, do not rebase. The ruleset requires branches up to date,
      # GitHub never updates a bot branch, and a bot PR armed for auto-merge
      # outlives this job. Whatever is still open is stale the moment
      # anything else merges; this run regenerates from main and replaces it.
      - name: close superseded bot PRs
        run: |
          for n in $(gh pr list --state open --json number,headRefName \
                     --jq '.[] | select(.headRefName | startswith("chore/compact-") or startswith("chore/post-merge-")) | .number'); do
            gh pr close "$n" --delete-branch --comment "superseded by worklog-compact run ${GITHUB_RUN_ID}" || true
          done

      - name: compact
        run: python3 bin/compact.py

      # Compaction restamps the top of the log with the current HEAD sha, and
      # the roadmap and IA manifest both record that sha as build provenance.
      # Committing the log without them leaves main failing
      # tests/test_provenance.py on a clean checkout -- a break no developer
      # caused and none can fix locally, because the next scheduled run
      # reintroduces it. Order matters: ia-manifest hashes what ia-inventory
      # wrote, which reads the roadmap, so running them out of order leaves a
      # stale body hash instead of fixing one.
      - name: regenerate derived docs
        run: |
          bin/worklog roadmap-render
          bin/worklog ia-inventory
          bin/worklog ia-manifest

      # Fail here before opening a PR that is already red. The PR still
      # pays invariants + coverage (required checks) on its own
      # pull_request run.
      - name: verify working tree
        run: |
          python3 bin/compact.py --merge-check .work/todo.jsonl .work/done.jsonl
          for t in tests/test_*.py; do python3 "$t" >/dev/null || { echo "FAILED: $t"; python3 "$t"; exit 1; }; done

      - name: commit via PR
        run: |
          if [ -z "$(git status --porcelain .work docs)" ]; then
            echo "nothing to compact"
            exit 0
          fi
          # An eviction-only night leaves todo.jsonl untouched, so its
          # compact line (and the watermark) is unchanged: name the run
          # by what it did instead of repeating last night's watermark.
          if git diff --quiet -- .work/todo.jsonl; then
            title="chore(worklog): compact: evict to archive"
          else
            wm=$(python3 -c "import json; print([e.get('through') for e in map(json.loads, open('.work/todo.jsonl')) if e.get('op') == 'compact'][-1])")
            title="chore(worklog): compact through $wm"
          fi
          git config user.name "worklog-bot"
          git config user.email "worklog-bot@users.noreply.github.com"
          branch="chore/compact-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add .work/todo.jsonl .work/done.jsonl docs
          # archive.jsonl exists only after the first eviction. Unguarded
          # `git add` of a missing path is fatal (Sep 1 run 33482394234).
          if [ -f .work/archive.jsonl ]; then
            git add .work/archive.jsonl
          fi
          WORKLOG_SKIP_BRANCH_GUARD=1 hooks/pre-commit
          git commit -m "$title"
          git push -u origin HEAD
          gh pr create --head "$branch" --base main \
            --title "$title" \
            --body "Nightly compaction. Auto-merge when green (ADR-0011). Never squash (ADR-0008)."
          gh pr merge --auto --merge --delete-branch
