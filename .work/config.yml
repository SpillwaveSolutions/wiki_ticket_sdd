# Machine-readable settings. The agent file (CLAUDE.md / AGENTS.md) carries
# policy only -- see WORKLOG-SPEC section 4. Scripts read THIS file.
version: 1

project:
  key: PROJ
  name: "Acme Platform"

ticketing:
  system: github               # github | gitlab | jira | ado | linear | codecatalyst | other | none
  # sync is skill-based (ticket-sync); no adapter binary
  project: SpillwaveSolutions/wiki_ticket_sdd

wiki:
  system: github-wiki          # github-wiki | gitlab-wiki | ado-wiki | confluence | other | none
  # publishing is skill-based (wiki-publish); no adapter binary
  root_url: https://github.com/SpillwaveSolutions/wiki_ticket_sdd/wiki

paths:
  plans: docs/plans
  status: docs/status
  roadmap: docs/roadmap.md

status:
  default_kind: daily
  week_starts: monday
  timecard:
    include_hours: false       # spec §17 Q4 closed: narrative only; this knob is dead
    actor: rick

sync:
  active_window_days: 14
  conflict_policy: report      # only policy; auto-resolve descoped (item 01KXY8V686)

features:
  auto_merge_on_green: true   # false = advisory: poll, report green, human merges

# Per-event artifact routing. `worklog triggers <event>` is the reader.
# An event key that is present (even as []) is the authority. Missing keys
# fall back to defaults. release.sync_docs / sync.push_on_capture /
# status.publish remain as legacy fallbacks for older configs.
triggers:
  plan-capture:
    - ticket-sync
    - wiki-publish:plans
  pr-open:
    - pr-description
  pr-merge:
    - roadmap-render
    - ticket-sync:close
  release:
    - design-doc
    - code-walkthrough
    - user-guide
    - readme
    - wiki-publish
    - ticket-sync
  status-report:
    - wiki-publish:status

classifier:
  enabled: false             # OFF by default. Inline CLAUDE.md path handles the common case.
  min_confidence: 0.7        # below this, propose kind:triage + open question, never a confident kind
  debounce: stop             # fire on the Stop hook (end of response), not per user message

# NOT configurable: the body-size cap (section 8.3) is derived from PIPE_BUF,
# not chosen. It lives in code as a constant. A knob whose only valid value is
# the default is a trap.

# Optional item fields (#108). `worklog fields` prints these with their
# meanings. Core fields are fixed and not listed here. Defaults: estimate,
# owner, risk, acceptance_criteria on; value, confidence, due_date, severity
# off.
work_item_fields:
  risk: on
  owner: on

# Retention (compaction step 9). Defaults match the code if this block is omitted.
retention:
  epic_days: 730
  story_days: 180
  task_days: 90
  subtask_days: 90
  cap: 1000
